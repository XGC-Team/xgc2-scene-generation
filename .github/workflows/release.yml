name: release

on:
  workflow_dispatch:
    inputs:
      expected_version:
        description: Expected .xgc2/product.yml version
        required: true
        type: string
      expected_source_sha:
        description: Expected source commit SHA
        required: true
        type: string
      publish_apt:
        description: Publish built debs to the XGC2 APT repository
        required: true
        default: false
        type: boolean
      run_cpp_quality:
        description: Run C++ quality checks
        required: true
        default: false
        type: boolean
      run_source_tests:
        description: Run source tests
        required: true
        default: false
        type: boolean

defaults:
  run:
    shell: bash

jobs:
  validate-release-inputs:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.product.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate expected version and source SHA
        id: product
        run: |
          set -euo pipefail
          version="$(sed -nE 's|^version:[[:space:]]*([^[:space:]#]+).*|\1|p' .xgc2/product.yml | head -n1)"
          if [[ -z "${version}" ]]; then
            echo "::error::missing version in .xgc2/product.yml"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          if [[ "${version}" != "${{ inputs.expected_version }}" ]]; then
            echo "::error::product.yml version ${version} does not match expected_version ${{ inputs.expected_version }}"
            exit 1
          fi
          source_sha="$(git rev-parse HEAD)"
          if [[ "${source_sha}" != "${{ inputs.expected_source_sha }}" ]]; then
            echo "::error::HEAD ${source_sha} does not match expected_source_sha ${{ inputs.expected_source_sha }}"
            exit 1
          fi

  package-compliance:
    needs: validate-release-inputs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check package metadata and packaging consistency
        run: |
          set -euo pipefail
          git diff --check HEAD
          .xgc2/scripts/check_package_compliance.sh

  cpp-quality:
    if: ${{ inputs.run_cpp_quality }}
    needs: validate-release-inputs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Run C++ static quality gate
        run: |
          mkdir -p "$RUNNER_TEMP/cpp-quality"
          docker run --rm \
            -e DEBIAN_FRONTEND=noninteractive \
            -e CPP_QUALITY_WORK_DIR=/workspace/work \
            -v "$GITHUB_WORKSPACE:/workspace/repo:ro" \
            -v "$RUNNER_TEMP/cpp-quality:/workspace/work" \
            ros:noetic-ros-base-focal \
            bash -lc '
              set -euo pipefail
              apt-get update
              apt-get install -y --no-install-recommends \
                build-essential \
                ca-certificates \
                clang-format \
                clang-tidy \
                cmake \
                curl \
                git \
                libeigen3-dev \
                rsync \
                ros-noetic-geometry-msgs \
                ros-noetic-message-generation \
                ros-noetic-message-runtime \
                ros-noetic-pcl-conversions \
                ros-noetic-pcl-ros \
                ros-noetic-roscpp \
                ros-noetic-rospy \
                ros-noetic-rviz \
                ros-noetic-sensor-msgs \
                ros-noetic-std-msgs \
                ros-noetic-tf2 \
                ros-noetic-tf2-geometry-msgs \
                ros-noetic-tf2-ros \
                ros-noetic-visualization-msgs

              install -m 0755 -d /etc/apt/keyrings
              curl -fsSL https://xgc2.apt.xiaokang.ink/xgc2-archive-keyring.gpg \
                -o /etc/apt/keyrings/xgc2-archive-keyring.gpg
              chmod 0644 /etc/apt/keyrings/xgc2-archive-keyring.gpg
              echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/xgc2-archive-keyring.gpg] https://xgc2.apt.xiaokang.ink focal main" \
                > /etc/apt/sources.list.d/xgc2.list
              apt-get update
              apt-get install -y --no-install-recommends libxgc2-math-dev

              /workspace/repo/.xgc2/scripts/check_cpp_quality.sh --work-dir /workspace/work
            '

  source-tests:
    if: ${{ inputs.run_source_tests }}
    needs: validate-release-inputs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build and run ROS package tests
        run: |
          mkdir -p "$RUNNER_TEMP/package-tests"
          docker run --rm \
            -e DEBIAN_FRONTEND=noninteractive \
            -e ROS_PACKAGE_CHECK_WORK_DIR=/workspace/work \
            -v "$GITHUB_WORKSPACE:/workspace/repo:ro" \
            -v "$RUNNER_TEMP/package-tests:/workspace/work" \
            ros:noetic-ros-base-focal \
            bash -lc '
              set -euo pipefail
              apt-get update
              apt-get install -y --no-install-recommends \
                build-essential \
                ca-certificates \
                cmake \
                curl \
                git \
                libeigen3-dev \
                rsync \
                ros-noetic-geometry-msgs \
                ros-noetic-message-generation \
                ros-noetic-message-runtime \
                ros-noetic-pcl-conversions \
                ros-noetic-pcl-ros \
                ros-noetic-roscpp \
                ros-noetic-rospy \
                ros-noetic-sensor-msgs \
                ros-noetic-std-msgs \
                ros-noetic-tf2 \
                ros-noetic-tf2-geometry-msgs \
                ros-noetic-tf2-ros \
                ros-noetic-visualization-msgs

              install -m 0755 -d /etc/apt/keyrings
              curl -fsSL https://xgc2.apt.xiaokang.ink/xgc2-archive-keyring.gpg \
                -o /etc/apt/keyrings/xgc2-archive-keyring.gpg
              chmod 0644 /etc/apt/keyrings/xgc2-archive-keyring.gpg
              echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/xgc2-archive-keyring.gpg] https://xgc2.apt.xiaokang.ink focal main" \
                > /etc/apt/sources.list.d/xgc2.list
              apt-get update
              apt-get install -y --no-install-recommends libxgc2-math-dev

              /workspace/repo/.xgc2/scripts/check_ros_packages.sh --work-dir /workspace/work
            '

  deb-build:
    needs:
      - validate-release-inputs
      - package-compliance
      - cpp-quality
      - source-tests
    if: ${{ always() && needs.validate-release-inputs.result == 'success' && needs.package-compliance.result == 'success' && (needs.cpp-quality.result == 'success' || needs.cpp-quality.result == 'skipped') && (needs.source-tests.result == 'success' || needs.source-tests.result == 'skipped') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      PACKAGE_VERSION: ${{ needs.validate-release-inputs.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Build and install-check deb packages in Docker
        run: |
          .xgc2/scripts/build_debs_in_docker.sh \
            --work-dir "$RUNNER_TEMP/scene-generation-${{ matrix.arch }}" \
            --output-dir "$GITHUB_WORKSPACE/debs"

      - name: Upload deb artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xgc2-scene-generation-release-debs-${{ matrix.arch }}
          path: debs/*.deb

  publish-apt:
    if: ${{ inputs.publish_apt }}
    needs: deb-build
    runs-on: ubuntu-latest
    env:
      APT_REPO_HOST: ${{ secrets.APT_REPO_HOST }}
      APT_REPO_PORT: ${{ secrets.APT_REPO_PORT }}
      APT_REPO_SSH_KEY: ${{ secrets.APT_REPO_SSH_KEY }}
      APT_REPO_KNOWN_HOSTS: ${{ secrets.APT_REPO_KNOWN_HOSTS }}
    steps:
      - uses: actions/checkout@v4

      - name: Download deb artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: xgc2-scene-generation-release-debs-*
          path: debs
          merge-multiple: true

      - name: Publish to self-hosted APT repository
        run: |
          set -euo pipefail
          test -n "${APT_REPO_HOST}"
          test -n "${APT_REPO_SSH_KEY}"
          test -n "${APT_REPO_KNOWN_HOSTS}"
          export APT_REPO_PORT="${APT_REPO_PORT:-22}"
          .xgc2/scripts/publish_apt_repo.sh --deb-dir debs
