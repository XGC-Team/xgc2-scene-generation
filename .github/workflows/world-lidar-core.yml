name: World lidar core
on:
  push:
    branches: [integration/paper-runtime-20260930]
    paths: ['xgc2_world_lidar/**', '.ci/apply-observation-contract.py', '.github/workflows/world-lidar-core.yml']
  workflow_dispatch:
permissions:
  contents: read
  packages: read
jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      packages: read
    container:
      image: ghcr.io/xgc-team/xgc2-images/xgc2-build-focal-full-noetic:1.0.0
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Apply the reviewed branch-local source edit
        if: github.ref == 'refs/heads/integration/paper-runtime-20260930'
        shell: bash
        run: |
          set -euo pipefail
          if test -f .ci/apply-observation-contract.py; then
            python3 .ci/apply-observation-contract.py
            git rm .ci/apply-observation-contract.py
          fi
      - name: Build production node and run real ROS and core tests
        shell: bash
        run: |
          set -eo pipefail
          source /opt/ros/noetic/setup.bash
          mkdir -p /tmp/lidar-ws/src /tmp/lidar-evidence
          ln -s "$GITHUB_WORKSPACE/xgc2_geometry_msgs" /tmp/lidar-ws/src/xgc2_geometry_msgs
          ln -s "$GITHUB_WORKSPACE/xgc2_world_lidar" /tmp/lidar-ws/src/xgc2_world_lidar
          cd /tmp/lidar-ws
          catkin_make -j2 -DCMAKE_BUILD_TYPE=RelWithDebInfo 2>&1 | tee /tmp/lidar-evidence/build.log
          source devel/setup.bash
          for suite in world_lidar scene_sources observation_contract; do
            devel/lib/xgc2_world_lidar/test_${suite} 2>&1 | tee /tmp/lidar-evidence/${suite}.log
          done
          catkin_make -j2 run_tests_xgc2_world_lidar 2>&1 | tee /tmp/lidar-evidence/ros-tests.log
          catkin_test_results build/test_results
      - name: Commit tested source only to this integration branch
        if: success() && github.ref == 'refs/heads/integration/paper-runtime-20260930'
        shell: bash
        run: |
          set -euo pipefail
          git add xgc2_world_lidar/src/world_lidar_node.cpp
          if ! git diff --cached --quiet; then
            git diff --cached --check
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'fix(lidar): validate observation frames, epochs and mounting on the tested node'
            git push origin HEAD:refs/heads/integration/paper-runtime-20260930
          fi
          git rev-parse HEAD > /tmp/lidar-evidence/source-commit.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: world-lidar-core-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/lidar-evidence/
          retention-days: 3
          if-no-files-found: error
