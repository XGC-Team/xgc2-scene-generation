name: World lidar core
on:
  push:
    branches: [integration/paper-runtime-20260930]
    paths: ['xgc2_world_lidar/**', '.github/workflows/world-lidar-core.yml']
  pull_request:
    branches: [noetic]
    paths: ['xgc2_world_lidar/**', '.github/workflows/world-lidar-core.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - name: Install compiler dependency
        run: sudo apt-get update -qq && sudo apt-get install -y libeigen3-dev
      - name: Compile and execute the production sensor core
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/lidar-evidence
          git rev-parse HEAD > /tmp/lidar-evidence/source-commit.txt
          for test in test_world_lidar test_scene_sources; do
            g++ -std=c++17 -O2 -Wall -Wextra -I/usr/include/eigen3 -Ixgc2_world_lidar/include \
              xgc2_world_lidar/src/world_lidar.cpp xgc2_world_lidar/src/scene_conversion.cpp \
              xgc2_world_lidar/src/convex_body_conversion.cpp xgc2_world_lidar/test/${test}.cpp \
              -o /tmp/${test}
            /tmp/${test} 2>&1 | tee /tmp/lidar-evidence/${test}.log
          done
      - name: Preserve the exact public source used for replay
        if: always()
        run: |
          mkdir -p /tmp/lidar-evidence
          git archive --format=tar.gz --output=/tmp/lidar-evidence/source.tar.gz HEAD
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: world-lidar-core-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/lidar-evidence/
          retention-days: 3
          if-no-files-found: error
