name: ci

on:
  push:
    branches:
      - noetic
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

defaults:
  run:
    shell: bash

jobs:
  cpp-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to the controlled build image registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run C++ static quality gate
        run: |
          .xgc2/scripts/run_in_build_container.sh \
            --work-dir "$RUNNER_TEMP/cpp-quality" -- \
            /workspace/scene-generation/.xgc2/scripts/check_cpp_quality.sh --work-dir /workspace/work

  package-compliance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check package metadata and packaging consistency
        run: |
          git diff --check HEAD
          .xgc2/scripts/check_package_compliance.sh

  ros-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: focal-noetic
            image: ghcr.io/xgc-team/xgc2-images/xgc2-build-focal-full-noetic:1.0.0
          - name: bionic-melodic
            image: ghcr.io/xgc-team/xgc2-images/xgc2-build-bionic-ros-melodic:1.0.0
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to the controlled build image registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and run declared ROS package tests
        run: |
          .xgc2/scripts/run_in_build_container.sh \
            --image "${{ matrix.image }}" \
            --work-dir "$RUNNER_TEMP/package-tests-${{ matrix.name }}" -- bash -c '
              set -euo pipefail
              python3 /workspace/scene-generation/.xgc2/scripts/test_package_debs.py
              /workspace/scene-generation/.xgc2/scripts/check_ros_packages.sh --work-dir /workspace/work
            '

  deb-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: amd64-focal-noetic
            arch: amd64
            distribution: focal
            runner: ubuntu-latest
            image: ghcr.io/xgc-team/xgc2-images/xgc2-build-focal-full-noetic:1.0.0
          - name: arm64-focal-noetic
            arch: arm64
            distribution: focal
            runner: ubuntu-24.04-arm
            image: ghcr.io/xgc-team/xgc2-images/xgc2-build-focal-full-noetic:1.0.0
          - name: amd64-bionic-melodic
            arch: amd64
            distribution: bionic
            runner: ubuntu-latest
            image: ghcr.io/xgc-team/xgc2-images/xgc2-build-bionic-ros-melodic:1.0.0
          - name: arm64-bionic-melodic
            arch: arm64
            distribution: bionic
            runner: ubuntu-24.04-arm
            image: ghcr.io/xgc-team/xgc2-images/xgc2-build-bionic-ros-melodic:1.0.0
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to the controlled build image registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and install-check deb packages in Docker
        run: |
          export PACKAGE_VERSION="$(awk '/^version:/ {print $2; exit}' .xgc2/product.yml)"
          install -d "$GITHUB_WORKSPACE/.ci/build-manifests"
          .xgc2/scripts/build_debs_in_docker.sh \
            --image "${{ matrix.image }}" \
            --work-dir "$RUNNER_TEMP/scene-generation-${{ matrix.name }}" \
            --output-dir "$GITHUB_WORKSPACE/debs"

      - name: Create trusted build manifest
        run: |
          product_version="$(awk '/^version:/ {print $2; exit}' .xgc2/product.yml)"
          python3 .xgc2/scripts/xgc2_artifact_manifest.py build \
            --deb-dir debs --output-dir .ci/build-manifests \
            --product xgc2-scene-generation --product-version "$product_version" \
            --distribution "${{ matrix.distribution }}" --architecture "${{ matrix.arch }}" \
            --source-sha "$GITHUB_SHA" --ci-run-id "$GITHUB_RUN_ID" \
            --ci-workflow "$GITHUB_WORKFLOW" --ci-workflow-ref "$GITHUB_WORKFLOW_REF"

      - name: Upload deb artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xgc2-scene-generation-debs-${{ matrix.name }}
          path: |
            debs/*.deb
            .ci/build-manifests/*.json
          retention-days: 14
          include-hidden-files: true
