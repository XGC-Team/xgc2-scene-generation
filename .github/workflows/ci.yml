name: ci

on:
  push:
    branches:
      - noetic
  pull_request:
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  cpp-quality:
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Run C++ static quality gate
        run: |
          mkdir -p "$RUNNER_TEMP/cpp-quality"
          docker run --rm \
            -e DEBIAN_FRONTEND=noninteractive \
            -e CPP_QUALITY_WORK_DIR=/workspace/work \
            -v "$GITHUB_WORKSPACE:/workspace/repo:ro" \
            -v "$RUNNER_TEMP/cpp-quality:/workspace/work" \
            ros:noetic-ros-base-focal \
            bash -lc '
              set -euo pipefail
              apt-get update
              apt-get install -y --no-install-recommends \
                build-essential \
                ca-certificates \
                clang-format \
                clang-tidy \
                cmake \
                curl \
                git \
                libeigen3-dev \
                rsync \
                ros-noetic-geometry-msgs \
                ros-noetic-message-generation \
                ros-noetic-message-runtime \
                ros-noetic-pcl-conversions \
                ros-noetic-pcl-ros \
                ros-noetic-roscpp \
                ros-noetic-rospy \
                ros-noetic-rviz \
                ros-noetic-sensor-msgs \
                ros-noetic-std-msgs \
                ros-noetic-tf2 \
                ros-noetic-tf2-geometry-msgs \
                ros-noetic-tf2-ros \
                ros-noetic-visualization-msgs

              install -m 0755 -d /etc/apt/keyrings
              curl -fsSL https://xgc2.apt.xiaokang.ink/xgc2-archive-keyring.gpg \
                -o /etc/apt/keyrings/xgc2-archive-keyring.gpg
              chmod 0644 /etc/apt/keyrings/xgc2-archive-keyring.gpg
              echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/xgc2-archive-keyring.gpg] https://xgc2.apt.xiaokang.ink focal main" \
                > /etc/apt/sources.list.d/xgc2.list
              apt-get update
              apt-get install -y --no-install-recommends libxgc2-math-dev

              /workspace/repo/.xgc2/scripts/check_cpp_quality.sh --work-dir /workspace/work
            '

  package-compliance:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check package metadata and packaging consistency
        run: |
          set -euo pipefail
          git diff --check HEAD
          .xgc2/scripts/check_package_compliance.sh

  ros-tests:
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build and run ROS package tests
        run: |
          mkdir -p "$RUNNER_TEMP/package-tests"
          docker run --rm \
            -e DEBIAN_FRONTEND=noninteractive \
            -e ROS_PACKAGE_CHECK_WORK_DIR=/workspace/work \
            -v "$GITHUB_WORKSPACE:/workspace/repo:ro" \
            -v "$RUNNER_TEMP/package-tests:/workspace/work" \
            ros:noetic-ros-base-focal \
            bash -lc '
              set -euo pipefail
              apt-get update
              apt-get install -y --no-install-recommends \
                build-essential \
                ca-certificates \
                cmake \
                curl \
                git \
                libeigen3-dev \
                rsync \
                ros-noetic-geometry-msgs \
                ros-noetic-message-generation \
                ros-noetic-message-runtime \
                ros-noetic-pcl-conversions \
                ros-noetic-pcl-ros \
                ros-noetic-roscpp \
                ros-noetic-rospy \
                ros-noetic-sensor-msgs \
                ros-noetic-std-msgs \
                ros-noetic-tf2 \
                ros-noetic-tf2-geometry-msgs \
                ros-noetic-tf2-ros \
                ros-noetic-visualization-msgs

              install -m 0755 -d /etc/apt/keyrings
              curl -fsSL https://xgc2.apt.xiaokang.ink/xgc2-archive-keyring.gpg \
                -o /etc/apt/keyrings/xgc2-archive-keyring.gpg
              chmod 0644 /etc/apt/keyrings/xgc2-archive-keyring.gpg
              echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/xgc2-archive-keyring.gpg] https://xgc2.apt.xiaokang.ink focal main" \
                > /etc/apt/sources.list.d/xgc2.list
              apt-get update
              apt-get install -y --no-install-recommends libxgc2-math-dev

              /workspace/repo/.xgc2/scripts/check_ros_packages.sh --work-dir /workspace/work
            '

  deb-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      - name: Build and install-check deb packages in Docker
        run: |
          set -euo pipefail
          export PACKAGE_VERSION="$(sed -nE 's|^version:[[:space:]]*([^[:space:]#]+).*|\1|p' .xgc2/product.yml | head -n1)"
          .xgc2/scripts/build_debs_in_docker.sh \
            --work-dir "$RUNNER_TEMP/scene-generation-${{ matrix.arch }}" \
            --output-dir "$GITHUB_WORKSPACE/debs"

      - name: Upload deb artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xgc2-scene-generation-debs-${{ matrix.arch }}
          path: debs/*.deb
