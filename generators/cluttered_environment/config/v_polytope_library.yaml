# V-polytope Template Library
# Defines complex convex obstacle shapes using vertex representation
# All vertices are in local coordinate frame (obstacle center)
# Only convex hull vertices are stored (no interior points)

# ========== Irregular rock shape (8 vertices) ==========
irregular_rock_1:
  description: "Irregular rock with asymmetric profile"
  vertices:
    # Bottom vertices (z ≈ -0.5, touching ground when centered at z=0.5)
    - [-0.45, -0.40, -0.50]   # Bottom corner 1
    - [ 0.50, -0.35, -0.50]   # Bottom corner 2
    - [ 0.45,  0.48, -0.50]   # Bottom corner 3
    - [-0.38,  0.42, -0.50]   # Bottom corner 4

    # Top vertices (z ≈ +0.8)
    - [-0.25, -0.15,  0.80]   # Top corner 1
    - [ 0.30, -0.20,  0.75]   # Top corner 2
    - [ 0.28,  0.25,  0.85]   # Top corner 3 (highest)
    - [-0.22,  0.30,  0.70]   # Top corner 4

# ========== Angular building debris (10 vertices) ==========
debris_angular_1:
  description: "Angular debris with pentagonal base"
  vertices:
    # Bottom pentagonal base (z = -0.6)
    - [ 0.00, -0.55, -0.60]   # Bottom vertex 1
    - [ 0.52, -0.17, -0.60]   # Bottom vertex 2
    - [ 0.32,  0.48, -0.60]   # Bottom vertex 3
    - [-0.32,  0.48, -0.60]   # Bottom vertex 4
    - [-0.52, -0.17, -0.60]   # Bottom vertex 5

    # Top irregular shape (z ≈ +0.8 to +1.0)
    - [ 0.00, -0.25,  1.00]   # Top peak
    - [ 0.30,  0.00,  0.85]   # Top side 1
    - [ 0.10,  0.28,  0.80]   # Top side 2
    - [-0.20,  0.22,  0.82]   # Top side 3
    - [-0.28, -0.10,  0.88]   # Top side 4

# ========== Flat irregular rock (6 vertices) ==========
rock_flat_1:
  description: "Flat rock with triangular profile"
  vertices:
    # Bottom triangle (z = -0.4)
    - [-0.50, -0.45, -0.40]   # Bottom vertex 1
    - [ 0.55, -0.38, -0.40]   # Bottom vertex 2
    - [ 0.05,  0.60, -0.40]   # Bottom vertex 3

    # Top triangle (z = +0.6, slightly offset)
    - [-0.30, -0.20,  0.60]   # Top vertex 1
    - [ 0.35, -0.15,  0.60]   # Top vertex 2
    - [ 0.00,  0.40,  0.60]   # Top vertex 3

# ========== Complex polyhedron (12 vertices) ==========
complex_poly_1:
  description: "Complex irregular polyhedron with 12 vertices"
  vertices:
    # Bottom layer (z = -0.5)
    - [-0.48, -0.42, -0.50]
    - [ 0.00, -0.55, -0.50]
    - [ 0.52, -0.30, -0.50]
    - [ 0.45,  0.40, -0.50]
    - [-0.02,  0.58, -0.50]
    - [-0.50,  0.25, -0.50]

    # Top layer (z ≈ +0.7 to +0.9)
    - [-0.30, -0.28,  0.90]
    - [ 0.00, -0.35,  0.85]
    - [ 0.32, -0.18,  0.75]
    - [ 0.28,  0.25,  0.80]
    - [ 0.00,  0.38,  0.88]
    - [-0.32,  0.15,  0.82]

# ========== Wedge-shaped obstacle (6 vertices) ==========
wedge_1:
  description: "Wedge shape like a ramp"
  vertices:
    # Base rectangle (z = -0.45)
    - [-0.50, -0.35, -0.45]
    - [ 0.50, -0.35, -0.45]
    - [ 0.50,  0.35, -0.45]
    - [-0.50,  0.35, -0.45]

    # Top edge (z = +0.65)
    - [-0.50,  0.00,  0.65]
    - [ 0.50,  0.00,  0.65]

