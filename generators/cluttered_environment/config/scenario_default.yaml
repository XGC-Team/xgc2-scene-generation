# Obstacles distributed in left (x: -5~9) and right (x: 11~25) regions
# Version: v2 - Optimized obstacle spacing to prevent local minima and dead-ends
#   - Increased minimum clearance between obstacles (≥1.5m)
#   - Moved Obs7 away from wall to improve left-side passage
#   - Redistributed right-side obstacles to eliminate tight clusters
#   - Key fixes: Obs12-Obs15 spacing (2.12m→6.4m), Obs14-Obs17 spacing (4.74m→7.2m)
# Version: v3 - Added 2 dynamic cube obstacles for velocity obstacle testing
