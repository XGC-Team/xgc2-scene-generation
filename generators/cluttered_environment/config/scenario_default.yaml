# Narrow Passage Scenario with Two Wall Obstacles (Optimized for Local Minima Avoidance)
# Generated by: AI-assisted manual editing
# Total obstacles: 22 (20 static + 2 dynamic)
# XY range: [-5.0, 25.0]m × [-8.0, 8.0]m
