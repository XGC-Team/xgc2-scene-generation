# 8-UAV comprehensive ground-obstacle scenario.
# 15 gray opaque cylinders are placed in the first south corridor.
# 12 gray opaque cubes implement the second east navigation corridor.
# 10 gray opaque floating hallway-style obstacles implement the third north corridor.
# 10 gray opaque cube frame groups implement the fourth west corridor
# in scenario_uav8_comprehensive_groups.yaml.
# The south corridor is the 20x10 side cell x=[-10,10], y=[-20,-10].
# The east corridor is the 10x20 side cell x=[10,20], y=[-10,10].
# The north corridor is the 20x10 side cell x=[-10,10], y=[10,20].
# The west corridor is the 10x20 side cell x=[-20,-10], y=[-10,10].
# The four 10x10 corners and 20x20 center are empty.
global:
  world_frame_id: "map"
  publish_rate: 20.0
  tf_publish_rate: 50.0
  resolution: 80

obstacles:
