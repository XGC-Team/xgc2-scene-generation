schema: xgc2.product.v1
id: xgc2-convex-geometry
name: XGC2 Convex Geometry
kind: ros1-apt
summary: Convex geometry messages and simulation environment tools for XGC2 ROS1.

ros:
  distro: noetic
  packages:
    - convex_geometry
    - convex_geometry_environment

apt:
  distribution: focal
  install:
    - ros-noetic-xgc2-convex-geometry-environment
  packages:
    - ros-noetic-xgc2-convex-geometry-core
    - ros-noetic-xgc2-convex-geometry-environment
  depends:
    - ros-noetic-xgc2-convex-geometry-core

usage:
  install: |
    sudo apt update
    sudo apt install ros-noetic-xgc2-convex-geometry-environment
  smoke_test: |
    rospack find convex_geometry
    rospack find convex_geometry_environment

ownership:
  paths:
    - /opt/ros/noetic/share/convex_geometry
    - /opt/ros/noetic/include/convex_geometry
    - /opt/ros/noetic/share/convex_geometry_environment
    - /opt/ros/noetic/include/convex_geometry_environment
    - /opt/ros/noetic/lib/convex_geometry_environment
