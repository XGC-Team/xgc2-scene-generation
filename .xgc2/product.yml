schema: xgc2.product.v1
id: xgc2-cluttered-environment
name: XGC2 Cluttered Environment
kind: ros1-apt
summary: ROS messages and simulation environment tools backed by the pure C++ XGC2 geometry library.

ros:
  distro: noetic
  packages:
    - xgc2_geometry_msgs
    - cluttered_environment

apt:
  distribution: focal
  install:
    - ros-noetic-xgc2-cluttered-environment
  packages:
    - ros-noetic-xgc2-geometry-msgs
    - ros-noetic-xgc2-cluttered-environment
  depends:
    - libxgc2-geometry-dev
    - ros-noetic-xgc2-geometry-msgs

usage:
  install: |
    sudo apt update
    sudo apt install ros-noetic-xgc2-cluttered-environment
  smoke_test: |
    rospack find xgc2_geometry_msgs
    rospack find cluttered_environment

ownership:
  paths:
    - /opt/ros/noetic/share/xgc2_geometry_msgs
    - /opt/ros/noetic/include/xgc2_geometry_msgs
    - /opt/ros/noetic/share/cluttered_environment
    - /opt/ros/noetic/include/cluttered_environment
    - /opt/ros/noetic/lib/cluttered_environment
