schema: xgc2.product.v1
id: xgc2-scene-generation
name: XGC2 Scene
version: 1.2.0-15
kind: ros1-apt
summary: Shared scene authoring, procedural map generators and simulated sensing;
  simulator integration is explicit and separate from scene domain logic.
ros:
  distro: noetic
  packages:
  - cluttered_environment
  - mockamap
  - xgc2_scene_runtime
  - xgc2_world_lidar
apt:
  distribution: focal
  install:
  - ros-noetic-xgc2-scene-generation
  package_distributions:
    ros-noetic-xgc2-scene-generation:
    - focal
    ros-noetic-xgc2-cluttered-environment:
    - focal
    ros-noetic-xgc2-mockamap:
    - focal
    ros-noetic-xgc2-scene-runtime:
    - focal
    ros-noetic-xgc2-world-lidar:
    - focal
  packages:
  - ros-noetic-xgc2-scene-generation
  - ros-noetic-xgc2-cluttered-environment
  - ros-noetic-xgc2-mockamap
  - ros-noetic-xgc2-scene-runtime
  - ros-noetic-xgc2-world-lidar
  depends:
  - ros-noetic-xgc2-scene-runtime (>= 1.2.0-3)
  - libxgc2-math-dev (>= 0.5.6-6~focal)
  - libxgc2-xrpc1 (>= 0.1.0-1~focal)
  - ros-noetic-xgc2-geometry-msgs (>= 1.2.0-13)
  - ros-noetic-xgc2-cluttered-environment (>= 1.1.4-11)
  - ros-noetic-xgc2-mockamap (>= 1.1.4-11)
usage:
  install: 'sudo apt update

    sudo apt install ros-noetic-xgc2-scene-generation

    '
  smoke_test: 'rospack find xgc2_scene_runtime

    rospack find cluttered_environment

    rospack find mockamap

    '
ownership:
  paths:
  - /opt/ros/noetic/share/cluttered_environment
  - /opt/ros/noetic/include/cluttered_environment
  - /opt/ros/noetic/lib/cluttered_environment
  - /opt/ros/noetic/share/xgc2_scene_runtime
  - /opt/ros/noetic/lib/xgc2_scene_runtime
  - /opt/ros/noetic/lib/python3/dist-packages/xgc2_scene_runtime
  - /opt/ros/noetic/lib/pkgconfig/xgc2_scene_runtime.pc
  - /opt/ros/noetic/share/xgc2_world_lidar
  - /opt/ros/noetic/include/xgc2_world_lidar
  - /opt/ros/noetic/lib/xgc2_world_lidar
  - /opt/ros/noetic/lib/pkgconfig/xgc2_world_lidar.pc
  - /opt/ros/noetic/share/mockamap
  - /opt/ros/noetic/include/mockamap
  - /opt/ros/noetic/lib/mockamap
release:
  requires:
  - xgc2-xrpc
  apt_versions:
    focal: 1.2.0-15
  dependency_policy:
    libxgc2-math-dev: rebuild
    xgc2-xrpc: verify
    xgc2-ros-msgs: rebuild
