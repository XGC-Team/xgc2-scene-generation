schema: xgc2.product.v1
id: xgc2-scene-generation
name: XGC2 Scene Generation
version: 1.2.0-12
kind: ros1-apt
summary: ROS1 scene-generation tools for convex obstacle scenarios and procedural
  point-cloud maps.
ros:
  distro: melodic,noetic
  packages:
  - xgc2_geometry_msgs
  - cluttered_environment
  - mockamap
  - xgc2_scene_runtime
  - xgc2_world_lidar
apt:
  distribution: bionic,focal
  install:
  - ros-melodic-xgc2-geometry-msgs
  - ros-noetic-xgc2-scene-generation
  package_distributions:
    ros-melodic-xgc2-geometry-msgs: [bionic]
    ros-noetic-xgc2-scene-generation: [focal]
    ros-noetic-xgc2-geometry-msgs: [focal]
    ros-noetic-xgc2-cluttered-environment: [focal]
    ros-noetic-xgc2-mockamap: [focal]
    ros-noetic-xgc2-scene-runtime: [focal]
    ros-noetic-xgc2-world-lidar: [focal]
  packages:
  - ros-melodic-xgc2-geometry-msgs
  - ros-noetic-xgc2-scene-generation
  - ros-noetic-xgc2-geometry-msgs
  - ros-noetic-xgc2-cluttered-environment
  - ros-noetic-xgc2-mockamap
  - ros-noetic-xgc2-scene-runtime
  - ros-noetic-xgc2-world-lidar
  depends:
  - ros-noetic-xgc2-scene-runtime (>= 1.2.0-3)
  - libxgc2-math-dev (>= 0.5.6-6~focal)
  - libxgc2-xrpc1 (>= 0.1.0-1~focal)
  - ros-noetic-xgc2-geometry-msgs (>= 1.1.4-11)
  - ros-noetic-xgc2-cluttered-environment (>= 1.1.4-11)
  - ros-noetic-xgc2-mockamap (>= 1.1.4-11)
usage:
  install: 'sudo apt update

    sudo apt install ros-melodic-xgc2-geometry-msgs

    sudo apt install ros-noetic-xgc2-scene-generation

    '
  smoke_test: 'rospack find xgc2_geometry_msgs

    rospack find cluttered_environment

    rospack find mockamap

    '
ownership:
  paths:
  - /opt/ros/melodic/share/xgc2_geometry_msgs
  - /opt/ros/melodic/include/xgc2_geometry_msgs
  - /opt/ros/melodic/lib/python2.7/dist-packages/xgc2_geometry_msgs
  - /opt/ros/melodic/lib/pkgconfig/xgc2_geometry_msgs.pc
  - /opt/ros/noetic/lib/python3/dist-packages/xgc2_geometry_msgs
  - /opt/ros/noetic/lib/pkgconfig/xgc2_geometry_msgs.pc
  - /opt/ros/noetic/share/xgc2_geometry_msgs
  - /opt/ros/noetic/include/xgc2_geometry_msgs
  - /opt/ros/noetic/share/cluttered_environment
  - /opt/ros/noetic/include/cluttered_environment
  - /opt/ros/noetic/lib/cluttered_environment
  - /opt/ros/noetic/share/xgc2_scene_runtime
  - /opt/ros/noetic/lib/xgc2_scene_runtime
  - /opt/ros/noetic/lib/python3/dist-packages/xgc2_scene_runtime
  - /opt/ros/noetic/lib/pkgconfig/xgc2_scene_runtime.pc
  - /opt/ros/noetic/share/xgc2_world_lidar
  - /opt/ros/noetic/include/xgc2_world_lidar
  - /opt/ros/noetic/lib/xgc2_world_lidar
  - /opt/ros/noetic/lib/pkgconfig/xgc2_world_lidar.pc
  - /opt/ros/noetic/share/mockamap
  - /opt/ros/noetic/include/mockamap
  - /opt/ros/noetic/lib/mockamap
release:
  apt_versions:
    focal: 1.2.0-12
  dependency_policy:
    libxgc2-math-dev: rebuild
