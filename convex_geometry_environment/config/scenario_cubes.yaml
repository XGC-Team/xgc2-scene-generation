# Simplified cube-only scenario for 8-UAV experiments
# Derived from scenario_default.yaml but reduced to 7 static cube obstacles

global:
  world_frame_id: "map"
  publish_rate: 20.0
  tf_publish_rate: 50.0
  resolution: 50

