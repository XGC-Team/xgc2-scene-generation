  - id: 0
    name: "cube_0"
    type: "cube"
    motion_type: "static"
    frame:
      id: "cube_frame_0"
    geometry:
      scale: [0.6, 0.6, 1.2]
    pose:
      position: [2.2, -0.8, 0.6]
      orientation:  [0.000000, 0.000000, 0.382683, 0.923880]
    visualization:
      color: [0.89, 0.32, 0.32, 0.9]   # Red
    velocity_obstacle:
